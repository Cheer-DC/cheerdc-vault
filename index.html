<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Cheer DC • Quick Reference Vault</title>
  <meta name="description" content="Quick reference and video tutorials for Cheer DC Motion Drills, Cheers, Dances, and Stunt Counts." />
  
  <!-- App Icons & PWA Manifest -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='20' font-size='20'>📣</text></svg>" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#75B2DD" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Cheer DC" />

  <!-- Typography: Athletic Display Fallback -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="styles.css?v=6" />
</head>
<body>

  <!-- Pride Accent Ribbon -->
  <div class="pride-stripe" aria-hidden="true"></div>

  <!-- Site Header -->
  <header class="site-header">
    <div class="header-container">
      <div class="brand-wrapper">
        <a href="#top" style="display:flex; align-items:center; gap:0.85rem;" aria-label="Cheer DC Reference Hub">
          <div class="brand-logo-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="var(--color-navy)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
            </svg>
          </div>
          <div class="brand-text">
            <h1>CHEER DC <span class="badge-pill">REFERENCE VAULT</span></h1>
            <p>Motions • Cheers • Dances • Stunts</p>
          </div>
        </a>
      </div>

      <!-- Desktop Nav Jump Links -->
      <nav class="desktop-nav" aria-label="Quick Navigation" id="desktop-nav-links">
        <button class="nav-link active" data-category="all">All</button>
        <button class="nav-link" data-category="motions">Motions</button>
        <button class="nav-link" data-category="cheers">Cheers</button>
        <button class="nav-link" data-category="dances">Dances</button>
        <button class="nav-link" data-category="stunts">Stunt Counts</button>
      </nav>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="main-wrapper" id="top">

    <!-- Header Controls: Search & Category Pills -->
    <div class="vault-controls-card">
      <div class="search-input-wrapper">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input 
          type="search" 
          id="global-search" 
          class="search-input" 
          placeholder="Search drills, cheers, dances, or stunt counts..." 
          aria-label="Search required material" 
        />
      </div>

      <!-- Category Filter Pills -->
      <div class="category-pills-row" id="category-pills" role="tablist" aria-label="Category Filters">
        <button class="pill-btn active" data-category="all">All</button>
        <button class="pill-btn" data-category="motions">🎯 Motion Drills</button>
        <button class="pill-btn" data-category="cheers">📣 Cheers</button>
        <button class="pill-btn" data-category="dances">💃 Dances</button>
        <button class="pill-btn" data-category="stunts">🤸 Stunt Counts & Warm-Ups</button>
      </div>
    </div>

    <!-- Results Status Counter -->
    <div class="results-meta-bar" id="results-meta">
      <span id="results-count">Showing all material</span>
      <span class="slowmo-tip">⚡ Tip: Built-in 0.5x slow-motion available in video player</span>
    </div>

    <!-- Clean Reference List Container -->
    <div class="reference-list-container" id="reference-list-container">
      <!-- Sections & Items dynamically populated via app.js -->
    </div>

  </main>

  <!-- VIDEO PLAYER MODAL WITH SPEED CONTROLS -->
  <div id="video-modal" class="video-modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-video-title">
    <div class="video-modal-dialog">
      <div class="video-modal-header">
        <div>
          <span class="category-badge-pill" id="modal-category-badge">Tutorial</span>
          <h3 id="modal-video-title" style="margin-top:0.25rem;">Video Title</h3>
        </div>
        <div style="display:flex; align-items:center; gap:0.5rem;">
          <a id="modal-external-link" href="#" target="_blank" rel="noopener noreferrer" class="btn btn-outline" style="padding:0.35rem 0.75rem; font-size:0.75rem; min-height:34px;">
            Open External ↗
          </a>
          <button id="close-modal-btn" class="close-modal-btn" aria-label="Close video player">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>
      </div>

      <!-- Responsive 16:9 Video Canvas -->
      <div class="video-player-container" id="modal-video-target">
        <!-- Iframe or Video injected via app.js -->
      </div>

      <!-- Playback Speed Controls (0.5x, 0.75x, 1x) -->
      <div class="video-playback-controls" id="modal-playback-controls">
        <span class="playback-label">Practice Playback Speed:</span>
        <div class="speed-buttons" id="speed-controls-row">
          <button class="speed-btn" data-speed="0.5" title="Half speed for learning counts">0.5x (Slow-Mo)</button>
          <button class="speed-btn" data-speed="0.75" title="Three-quarter speed for transitions">0.75x (Practice)</button>
          <button class="speed-btn active" data-speed="1" title="Normal tempo">1.0x (Normal)</button>
          <button class="speed-btn" data-speed="1.25" title="Up-tempo speed">1.25x</button>
        </div>
      </div>
    </div>
  </div>

  <!-- MOBILE BOTTOM NAVIGATION (Quick thumb switching on gym mats) -->
  <nav class="bottom-nav" aria-label="Mobile Navigation" id="mobile-bottom-nav">
    <button class="bottom-nav-item active" data-category="all">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
      All
    </button>
    <button class="bottom-nav-item" data-category="motions">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
      Motions
    </button>
    <button class="bottom-nav-item" data-category="cheers">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>
      Cheers
    </button>
    <button class="bottom-nav-item" data-category="dances">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polygon points="10 8 16 12 10 16 10 8"></polygon></svg>
      Dances
    </button>
    <button class="bottom-nav-item" data-category="stunts">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
      Stunts
    </button>
  </nav>

  <!-- Site Footer -->
  <footer class="site-footer">
    <div class="footer-content">
      <p class="footer-tagline">
        <strong>Cheer DC</strong> • 
      </p>
      <div class="footer-social-links">
        <a href="https://instagram.com/cheerdc" target="_blank" rel="noopener noreferrer">Instagram</a>
        <span>•</span>
        <a href="https://facebook.com/cheerdc" target="_blank" rel="noopener noreferrer">Facebook</a>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="data.js?v=8"></script>
  <script src="app.js?v=8"></script>
</body>
</html>
